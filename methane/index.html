<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,user-scalable=no"name=viewport><title>Super Methane Brothers</title><link href=data:, rel=icon><style>body,html{margin:0;padding:0;height:100%;background:#000;overflow:hidden}#container{display:flex;align-items:center;justify-content:center;height:100%}canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}#controls{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#888;font:12px monospace;pointer-events:none}#start-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.6)}#start-overlay h1{color:#ff0;font:bold 48px monospace;margin:0 0 24px;text-shadow:3px 3px #000;text-align:center}#start-overlay .hint{color:#fff;font:20px monospace;margin:0;text-align:center;text-shadow:2px 2px #000}</style></head><body><div id=container><canvas id=canvas></canvas></div><div id=start-overlay><div><h1>SUPER METHANE BROTHERS</h1><p class=hint>Click to start</p></div></div><div id=controls>P1: ESDF + Z  |  P2: Arrows + M  |  Tab: graphics  |  F1: pause  |  F9/F10: speed  |  Esc: restart</div><script>document.addEventListener("keydown",(function(e){switch(e.code){case"KeyE":case"KeyS":case"KeyD":case"KeyF":case"KeyZ":case"KeyM":case"ArrowUp":case"ArrowDown":case"ArrowLeft":case"ArrowRight":case"Tab":case"F1":case"F9":case"F10":case"Space":case"Enter":var a=e.target;if(a&&a.tagName&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;e.preventDefault()}}),!0);var Module={canvas:document.getElementById("canvas"),print:function(e){console.log(e)},printErr:function(e){console.error(e)}}</script><script async src=methane.js></script></body></html>
